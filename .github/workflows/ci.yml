name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  mypy:
    name: mypy strict
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install homeassistant python-socketio mypy
      - run: python -m mypy --strict custom_components/georide

  pytest:
    name: pytest (unit + offline)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest-homeassistant-custom-component pytest-cov python-socketio
      - name: Run tests excluding live
        run: python -m pytest tests/ -m "not live" --cov=custom_components/georide --cov-report=term
