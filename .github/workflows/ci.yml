name: CI

on:
  push:
    branches: [main]
  pull_request:

# Read-only token: the jobs only check out and test the code.
permissions:
  contents: read

jobs:
  mypy:
    name: mypy strict
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install homeassistant mypy
      - run: python -m mypy --strict custom_components/georide

  pytest:
    name: pytest (unit + offline)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest-homeassistant-custom-component pytest-cov
      - name: Run tests excluding live
        run: python -m pytest tests/ -m "not live" --cov=custom_components/georide --cov-report=term
