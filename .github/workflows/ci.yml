name: CI

on:
  push:
    branches: [main]
  pull_request:

# Read-only token: the jobs only check out and test the code.
permissions:
  contents: read

jobs:
  mypy:
    name: mypy strict
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install homeassistant mypy
      - run: python -m mypy --strict custom_components/georide_ha

  pytest:
    name: pytest (unit + offline)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # Official test harness, versioned like Home Assistant: latest HA.
          pip install pytest-homeassistant pytest-cov
      - name: Run tests excluding live
        run: python -m pytest tests/ -m "not live" --cov=custom_components/georide_ha --cov-report=term

  card:
    name: Lovelace card syntax
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      # A syntax error ships a card that never loads; parse it as the module it is.
      - run: cp lovelace/georide-card.js /tmp/card.mjs && node --check /tmp/card.mjs
