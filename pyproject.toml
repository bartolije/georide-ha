[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = [".", "custom_components"]
markers = [
    "live: test hits the real GeoRide API (skipped without credentials)",
]
filterwarnings = [
    "ignore::DeprecationWarning",
]

[tool.mypy]
strict = true
files = ["custom_components/georide"]
exclude = ["tests/", "lovelace/"]
python_version = "3.12"
