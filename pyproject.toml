[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "-p no:respx"
testpaths = ["tests"]
pythonpath = [".", "custom_components"]
markers = [
    "live: test hits the real GeoRide API (skipped without credentials)",
]
filterwarnings = [
    "ignore::DeprecationWarning",
]

[tool.mypy]
strict = true
files = ["custom_components/georide"]
exclude = ["tests/", "lovelace/"]
python_version = "3.14"
